<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacola - Pasterry</title>
<style>
/* ===== RESET E BASE ===== */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #1A1210;
  color: #e6eef6;
  padding: 16px;
  padding-bottom: 200px;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ===== HEADER ===== */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header h1 {
  font-size: 24px;
  color: #FFD700;
  margin: 0;
}
.header .badge {
  background: #AC940D;
  color: #fff;
  padding: 4px 14px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
}

/* ===== TÍTULOS ===== */
h3 {
  margin: 16px 0 10px;
  font-size: 18px;
  color: #FFD700;
  display: flex;
  align-items: center;
  gap: 8px;
}
h3 .count {
  font-size: 12px;
  color: #9aa6b2;
  font-weight: 400;
}

/* ===== BOTÕES ===== */
.btn {
  padding: 8px 14px;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, background 0.2s, box-shadow 0.2s;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:active {
  transform: scale(0.95);
}
.btn.primary {
  background: #28a745;
  color: #fff;
  box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
}
.btn.primary:hover {
  background: #34ce57;
  box-shadow: 0 4px 20px rgba(40, 167, 69, 0.4);
}
.btn.primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
}
.btn.secondary {
  background: #2a201d;
  color: #e6eef6;
  border: 1px solid rgba(255,255,255,0.08);
}
.btn.secondary:hover {
  background: #3d2f2a;
}
.btn.danger {
  background: #dc3545;
  color: #fff;
}
.btn.danger:hover {
  background: #e74c5c;
}
.btn.small {
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 6px;
}
.btn.large {
  padding: 12px 20px;
  font-size: 16px;
}
.btn.cupom {
  background: #FFD700;
  color: #1A1210;
}
.btn.cupom:hover {
  background: #ffe44d;
}
.btn.cupom:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== ITENS EXTRAS ===== */
.extras {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  margin: 8px 0 14px;
  padding: 4px 2px 8px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  scroll-snap-type: x mandatory;
}
.extras::-webkit-scrollbar {
  display: none;
}
.extra-card {
  flex: 0 0 130px;
  background: #2a201d;
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.04);
  transition: transform 0.2s, border-color 0.2s;
  scroll-snap-align: start;
}
.extra-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255,215,0,0.2);
}
.extra-card img {
  width: 100%;
  height: 55px;
  object-fit: cover;
  border-radius: 8px;
  background: #0a1420;
}
.extra-card .nome {
  font-size: 12px;
  font-weight: 600;
  margin: 6px 0 2px;
  color: #e6eef6;
}
.extra-card .preco {
  font-size: 13px;
  color: #FFD700;
  font-weight: 700;
  margin-bottom: 6px;
}
.extra-card .btn {
  width: 100%;
  padding: 4px;
  font-size: 13px;
  border-radius: 6px;
}

/* ===== CUPOM DE DESCONTO ===== */
.cupom-area {
  background: #2a201d;
  border-radius: 12px;
  padding: 14px 16px;
  margin: 10px 0 12px;
  border: 1px solid rgba(255,255,255,0.04);
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.cupom-area input {
  flex: 1;
  min-width: 150px;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.06);
  background: #0a1420;
  color: #e6eef6;
  font-size: 14px;
  text-transform: uppercase;
}
.cupom-area input:focus {
  outline: none;
  border-color: #FFD700;
}
.cupom-area input:disabled {
  opacity: 0.5;
}
.cupom-area .btn {
  padding: 10px 20px;
}
.cupom-aplicado {
  background: rgba(40, 167, 69, 0.15);
  border: 1px solid #28a745;
  border-radius: 10px;
  padding: 10px 14px;
  margin: 8px 0;
  display: none;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.cupom-aplicado.visible {
  display: flex;
}
.cupom-aplicado .info {
  color: #4caf50;
  font-weight: 600;
}
.cupom-aplicado .remove {
  color: #dc3545;
  cursor: pointer;
  font-weight: 700;
  background: transparent;
  border: none;
  font-size: 14px;
}

/* ===== CARRINHO ===== */
.cart-empty {
  text-align: center;
  padding: 40px 20px;
  color: #9aa6b2;
}
.cart-empty .icon {
  font-size: 48px;
  margin-bottom: 12px;
}
.cart-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: #2a201d;
  border-radius: 10px;
  margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,0.04);
  transition: transform 0.15s;
}
.cart-item:hover {
  transform: scale(1.01);
}
.cart-item img {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 8px;
  background: #0a1420;
}
.cart-item .info {
  flex: 1;
  min-width: 0;
}
.cart-item .info .title {
  font-weight: 600;
  font-size: 14px;
}
.cart-item .info .price {
  font-size: 12px;
  color: #FFD700;
}
.cart-item .qty-control {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  padding: 2px;
}
.cart-item .qty-control .btn {
  width: 28px;
  height: 28px;
  padding: 0;
  font-size: 16px;
  border-radius: 6px;
}
.cart-item .qty-control .qty {
  min-width: 24px;
  text-align: center;
  font-weight: 700;
}
.cart-item .item-total {
  font-weight: 700;
  color: #FFD700;
  font-size: 14px;
  min-width: 50px;
  text-align: right;
}

/* ===== TOTAIS ===== */
.totais {
  background: #2a201d;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.04);
}
.totais .linha {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 14px;
  color: #9aa6b2;
}
.totais .linha.total {
  border-top: 1px solid rgba(255,255,255,0.06);
  margin-top: 6px;
  padding-top: 10px;
  font-size: 18px;
  font-weight: 800;
  color: #fff;
}
.totais .linha.total .valor {
  color: #FFD700;
}
.totais .linha .destaque {
  color: #4caf50;
  font-weight: 600;
}
.totais .linha .desconto {
  color: #4caf50;
}
.totais .linha .distancia {
  font-size: 11px;
  color: #6a7a8a;
}

/* ===== RODAPÉ ===== */
.footer-actions {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: linear-gradient(180deg, transparent, #1A1210 20%, #1A1210);
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  box-sizing: border-box;
  z-index: 50;
}
.footer-buttons {
  display: flex;
  gap: 12px;
}
.btn-large {
  padding: 14px 16px;
  font-size: 16px;
  flex: 1;
  border-radius: 12px;
}

/* ===== MODAL ===== */
#modalEndereco {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.75);
  justify-content: center;
  align-items: center;
  z-index: 110;
  backdrop-filter: blur(4px);
  padding: 16px;
}
.modal-content {
  background: #1f1a18;
  padding: 20px;
  border-radius: 16px;
  width: 380px;
  max-width: 100%;
  max-height: 90vh;
  overflow: auto;
  scrollbar-width: none;
  border: 1px solid rgba(255,255,255,0.05);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(-20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-content::-webkit-scrollbar {
  display: none;
}
.modal-content .modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-content .modal-header h3 {
  margin: 0;
  font-size: 20px;
}
.modal-content .close-btn {
  background: rgba(255,255,255,0.05);
  border: none;
  color: #9aa6b2;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  transition: background 0.2s;
}
.modal-content .close-btn:hover {
  background: rgba(255,255,255,0.1);
}
.modal-content input,
.modal-content select {
  width: 100%;
  padding: 10px 12px;
  margin: 5px 0;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  background: #0a1420;
  color: #e6eef6;
  font-size: 14px;
  box-sizing: border-box;
  transition: border-color 0.2s;
}
.modal-content input:focus,
.modal-content select:focus {
  outline: none;
  border-color: #FFD700;
  box-shadow: 0 0 0 3px rgba(255,215,0,0.08);
}
.modal-content input::placeholder {
  color: #5a6a7a;
}
.modal-content .field-label {
  font-size: 12px;
  color: #9aa6b2;
  margin-top: 8px;
  display: block;
}
.modal-content .field-label .required {
  color: #ff6b6b;
}
.geo-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #1a5a3a, #2a8a5a);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  margin: 6px 0;
  cursor: pointer;
  transition: transform 0.15s, filter 0.2s;
}
.geo-btn:hover {
  filter: brightness(1.1);
}
.geo-btn:active {
  transform: scale(0.97);
}
.geo-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.geo-status {
  text-align: center;
  font-size: 12px;
  min-height: 18px;
  color: #4caf50;
  margin-bottom: 4px;
}
.geo-status.error {
  color: #ff6b6b;
}
.cupom-modal {
  background: #0a1420;
  border: 1px dashed rgba(255,255,255,0.06);
  padding: 12px 14px;
  margin: 12px 0;
  border-radius: 10px;
  font-size: 13px;
}
.cupom-modal h4 {
  margin: 0 0 6px;
  color: #FFD700;
  font-size: 14px;
}
.cupom-modal .itens {
  color: #9aa6b2;
  font-size: 13px;
  line-height: 1.6;
}
.cupom-modal .total {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.04);
  font-weight: 700;
}
.cupom-modal .total .destaque {
  color: #FFD700;
}
.cupom-modal .total .desconto {
  color: #4caf50;
}
.erro-geral {
  background: rgba(255,92,92,0.12);
  color: #ffb4b4;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
  display: none;
  border: 1px solid rgba(255,92,92,0.2);
  font-size: 13px;
}
.erro-geral.visible {
  display: block;
}
#modalEndereco .btn.primary {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  font-size: 16px;
  border-radius: 12px;
}

/* ===== LOADING ===== */
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 120;
  backdrop-filter: blur(6px);
}
.loading-overlay.active {
  display: flex;
}
.loading-content {
  text-align: center;
  color: #fff;
}
.spinner {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 4px solid rgba(255,255,255,0.1);
  border-top-color: #FFD700;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
.loading-content .text {
  font-size: 18px;
  font-weight: 600;
}
.loading-content .sub {
  font-size: 13px;
  color: #9aa6b2;
  margin-top: 4px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== LIMPAR SACOLA ===== */
.btn-limpar {
  background: transparent;
  border: 1px solid rgba(220,53,69,0.3);
  color: #dc3545;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: background 0.2s;
  margin-top: 4px;
}
.btn-limpar:hover {
  background: rgba(220,53,69,0.1);
}

/* ===== RESPONSIVO ===== */
@media (max-width: 480px) {
  body {
    padding: 12px;
    padding-bottom: 180px;
  }
  .header h1 {
    font-size: 20px;
  }
  .modal-content {
    padding: 16px;
  }
  .extra-card {
    flex: 0 0 110px;
  }
  .cart-item {
    padding: 8px 10px;
    flex-wrap: wrap;
  }
  .cart-item .item-total {
    min-width: auto;
    margin-left: auto;
  }
  .footer-buttons {
    flex-direction: column;
    gap: 8px;
  }
  .btn-large {
    padding: 12px;
  }
  .totais .linha.total {
    font-size: 16px;
  }
  .cupom-area {
    flex-direction: column;
  }
  .cupom-area input {
    width: 100%;
  }
  .cupom-area .btn {
    width: 100%;
  }
}

@media (max-width: 360px) {
  .extra-card {
    flex: 0 0 95px;
    padding: 6px;
  }
  .extra-card img {
    height: 40px;
  }
  .cart-item img {
    width: 40px;
    height: 40px;
  }
  .cart-item .info .title {
    font-size: 12px;
  }
}

/* ===== TOAST ===== */
.toast-container {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 130;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: rgba(0,0,0,0.9);
  color: #fff;
  padding: 12px 20px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.05);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
  display: flex;
  align-items: center;
  gap: 10px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(-20px); }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>🛒 Sacola</h1>
  <span class="badge" id="cartBadge">0 itens</span>
</div>

<!-- ===== ITENS EXTRAS (MOLHOS / ADICIONAIS) ===== -->
<h3>🧂 Itens Extras <span class="count">(adicione ao seu pedido)</span></h3>
<div class="extras" id="extrasContainer">
  <div style="color:#6a7a8a; padding:10px; text-align:center; width:100%;">Carregando itens extras...</div>
</div>

<!-- ===== CUPOM DE DESCONTO ===== -->
<div class="cupom-area">
  <input type="text" id="cupomInput" placeholder="Digite seu cupom de desconto" maxlength="20" />
  <button class="btn cupom" id="btnAplicarCupom">🎫 Aplicar</button>
</div>
<div class="cupom-aplicado" id="cupomAplicado">
  <span class="info">✅ Cupom aplicado!</span>
  <button class="remove" id="btnRemoverCupom">✕ Remover</button>
</div>

<!-- ===== CARRINHO ===== -->
<h3>📦 Itens do Pedido <span class="count" id="itensCount"></span></h3>
<div id="cart"></div>

<!-- ===== AÇÕES ===== -->
<button class="btn-limpar" onclick="limparSacola()">🗑️ Esvaziar sacola</button>

<!-- ===== RODAPÉ ===== -->
<div class="footer-actions">
  <div id="totais"></div>
  <div class="footer-buttons">
    <button class="btn danger btn-large" onclick="location.href='index.html'">← Voltar</button>
    <button id="btnConfirmar" class="btn primary btn-large" onclick="abrirModal()">✅ Confirmar</button>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div id="modalEndereco">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📦 Finalizar Pedido</h3>
      <button class="close-btn" onclick="fecharModal()">✕</button>
    </div>

    <button id="btnGeo" class="geo-btn" onclick="usarLocalizacao()">📍 Usar minha localização</button>
    <div id="geoStatus" class="geo-status"></div>

    <label class="field-label"><span class="required">*</span> Nome completo</label>
    <input id="nome" placeholder="Digite seu nome completo">

    <label class="field-label"><span class="required">*</span> WhatsApp com DDD</label>
    <input id="telefone" placeholder="(11) 99999-9999">

    <label class="field-label"><span class="required">*</span> Cidade</label>
    <select id="cidade"><option value="">Selecione sua cidade*</option></select>

    <label class="field-label"><span class="required">*</span> Rua</label>
    <input id="rua" placeholder="Nome da rua">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <label class="field-label"><span class="required">*</span> Número</label>
        <input id="numero" placeholder="Número">
      </div>
      <div>
        <label class="field-label"><span class="required">*</span> Bairro</label>
        <input id="bairro" placeholder="Bairro">
      </div>
    </div>

    <label class="field-label"><span class="required">*</span> Forma de pagamento</label>
    <select id="pagamento">
      <option value="">Selecione uma opção*</option>
      <option value="Dinheiro">💰 Dinheiro</option>
      <option value="Pix">📱 Pix</option>
      <option value="Debito">💳 Débito</option>
      <option value="Credito">💳 Crédito</option>
    </select>

    <input id="troco" placeholder="Troco para quanto? (opcional)" style="display:none">

    <div class="cupom-modal">
      <h4>📋 Resumo do Pedido</h4>
      <div class="itens" id="cupomItens"></div>
      <div class="total" id="cupomTotal"></div>
    </div>

    <div id="erroEnvio" class="erro-geral"></div>
    <button class="btn primary" onclick="enviarPedido()">✅ Confirmar e Enviar</button>
  </div>
</div>

<!-- ===== LOADING ===== -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-content">
    <div class="spinner"></div>
    <div class="text">Enviando pedido...</div>
    <div class="sub">Aguarde um momento</div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toastContainer"></div>

var cuponsValidos = [];

var getCart = function() {
  try {
    return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
  } catch(e) {
    return [];
  }
};

var setCart = function(c) {
  localStorage.setItem(CART_KEY, JSON.stringify(c));
};

var money = function(v) {
  return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
};

var distanciaKm = function(a, b, c, d) {
  var R = 6371;
  var e = (c - a) * Math.PI / 180;
  var f = (d - b) * Math.PI / 180;
  return R * 2 * Math.asin(Math.sqrt(Math.sin(e/2)*Math.sin(e/2) + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(f/2)*Math.sin(f/2)));
};

function calcularTaxa(km) {
  if (!configEntrega || !configEntrega.faixas) return 5;
  var faixas = configEntrega.faixas.sort(function(a, b) { return a.ate - b.ate; });
  var f = null;
  for (var i = 0; i < faixas.length; i++) {
    if (km <= faixas[i].ate) {
      f = faixas[i];
      break;
    }
  }
  return f ? Number(f.taxa) : Number(faixas[faixas.length - 1].taxa);
}

function gerarCodigoPedido() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

function showToast(msg, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  var toast = document.createElement('div');
  toast.className = 'toast';
  var icon = type === 'success' ? '✅' : '⚠️';
  toast.innerHTML = icon + ' ' + msg;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) toast.remove();
  }, 2200);
}

// ============================================================
// CARREGAR CUPONS COM FALLBACK
// ============================================================
function carregarCupons() {
  console.log('🏷️ Carregando cupons...');
  
  db.collection('config').doc('cupons').get()
    .then(function(doc) {
      console.log('📄 Documento cupons existe?', doc.exists);
      
      if (doc.exists) {
        var data = doc.data();
        console.log('📦 Dados do documento:', data);
        console.log('🔑 Campos:', Object.keys(data));
        
        // Tenta carregar de "cupons" ou "cupom"
        if (data.cupons && Array.isArray(data.cupons) && data.cupons.length > 0) {
          cuponsValidos = data.cupons;
          console.log('✅ Cupons carregados do Firebase:', cuponsValidos.length, 'itens');
        } else if (data.cupom && Array.isArray(data.cupom) && data.cupom.length > 0) {
          cuponsValidos = data.cupom;
          console.log('✅ Cupons carregados do Firebase (campo "cupom"):', cuponsValidos.length, 'itens');
        } else {
          console.warn('⚠️ Nenhum cupom encontrado no documento. Usando fallback.');
          cuponsValidos = CUPONS_FALLBACK;
        }
      } else {
        console.warn('⚠️ Documento "cupons" não existe. Usando fallback.');
        cuponsValidos = CUPONS_FALLBACK;
      }
      
      console.log('🏷️ Cupons disponíveis:', cuponsValidos);
      
      // Verificar se há cupom salvo no localStorage
      var saved = localStorage.getItem(CUPOM_KEY);
      if (saved) {
        try {
          var parsed = JSON.parse(saved);
          var aindaValido = cuponsValidos.some(function(c) { return c.codigo === parsed.codigo; });
          if (aindaValido) {
            cupomAplicado = parsed;
            document.getElementById('cupomAplicado').classList.add('visible');
            document.getElementById('cupomInput').value = parsed.codigo;
            document.getElementById('cupomInput').disabled = true;
            document.getElementById('btnAplicarCupom').disabled = true;
            console.log('✅ Cupom restaurado:', parsed.codigo);
          } else {
            localStorage.removeItem(CUPOM_KEY);
            cupomAplicado = null;
          }
        } catch (e) {
          localStorage.removeItem(CUPOM_KEY);
          cupomAplicado = null;
        }
      }
      
      renderTotais();
      renderCupom();
    })
    .catch(function(err) {
      console.error('❌ Erro ao carregar cupons:', err);
      // FALLBACK em caso de erro
      cuponsValidos = CUPONS_FALLBACK;
      renderTotais();
      renderCupom();
    });
}

// ============================================================
// APLICAR CUPOM
// ============================================================
function aplicarCupom() {
  var codigo = document.getElementById('cupomInput').value.trim().toUpperCase();
  if (!codigo) {
    showToast('Digite um código de cupom.', 'error');
    return;
  }

  console.log('🔍 Buscando cupom:', codigo);
  console.log('📋 Cupons disponíveis:', cuponsValidos);

  var cupom = null;
  for (var i = 0; i < cuponsValidos.length; i++) {
    if (cuponsValidos[i].codigo === codigo) {
      cupom = cuponsValidos[i];
      break;
    }
  }
  
  if (!cupom) {
    showToast('Cupom inválido.', 'error');
    console.warn('❌ Cupom não encontrado:', codigo);
    return;
  }

  var cart = getCart();
  var subtotal = 0;
  for (var i = 0; i < cart.length; i++) {
    subtotal += (cart[i].price || 0) * (cart[i].qty || 1);
  }
  
  if (cupom.minimo && subtotal < cupom.minimo) {
    showToast('Valor mínimo para este cupom: R$ ' + cupom.minimo.toFixed(2), 'error');
    return;
  }

  cupomAplicado = cupom;
  localStorage.setItem(CUPOM_KEY, JSON.stringify(cupom));
  document.getElementById('cupomAplicado').classList.add('visible');
  document.getElementById('cupomInput').disabled = true;
  document.getElementById('btnAplicarCupom').disabled = true;
  showToast('✅ Cupom ' + cupom.codigo + ' aplicado! ' + cupom.desconto + '% de desconto.');
  renderTotais();
  renderCupom();
}

// FUNÇÕES DO CARRINHO - ITENS EXTRAS
// ============================================================
window.addExtra = function(nome, preco, img) {
  var c = getCart();
  var id = 'extra_' + nome.replace(/\s/g, '_');
  var existente = null;
  for (var i = 0; i < c.length; i++) {
    if (c[i].id === id) {
      existente = c[i];
      break;
    }
  }
  if (existente) {
    existente.qty++;
  } else {
    c.push({
      id: id,
      title: nome,
      price: preco,
      qty: 1,
      img: img || '',
      tipo: 'extra'
    });
  }
  setCart(c);
  renderCart();
  showToast(nome + ' adicionado!');
};

// ============================================================
// RENDERIZAR CARRINHO
// ============================================================
function renderCart() {
  var c = getCart();
  var container = document.getElementById('cart');
  var countEl = document.getElementById('itensCount');
  var badgeEl = document.getElementById('cartBadge');
  var totalItens = 0;
  for (var i = 0; i < c.length; i++) {
    totalItens += c[i].qty;
  }

  if (badgeEl) badgeEl.textContent = totalItens + ' itens';
  if (countEl) countEl.textContent = '(' + totalItens + ' itens)';

  if (c.length === 0) {
    container.innerHTML = '<div class="cart-empty"><div class="icon">🛒</div><div style="font-weight:600;margin-bottom:4px;">Sacola vazia</div><div style="font-size:13px;color:#6a7a8a;">Adicione um pastel ou item extra</div></div>';
  } else {
    var html = '';
    for (var j = 0; j < c.length; j++) {
      var it = c[j];
      var sub = (it.price || 0) * (it.qty || 1);
      var isExtra = it.tipo === 'extra';
      var imgSrc = it.img || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22%3E%3Crect width=%2250%22 height=%2250%22 fill=%22%230a1420%22/%3E%3Ctext x=%2225%22 y=%2232%22 text-anchor=%22middle%22 fill=%22%239aa6b2%22 font-size=%2214%22%3E' + (isExtra ? '🧂' : '🍕') + '%3C/text%3E%3C/svg%3E';
      
      html += '<div class="cart-item">';
      html += '<img src="' + imgSrc + '" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22%3E%3Crect width=%2250%22 height=%2250%22 fill=%22%230a1420%22/%3E%3Ctext x=%2225%22 y=%2232%22 text-anchor=%22middle%22 fill=%22%239aa6b2%22 font-size=%2214%22%3E' + (isExtra ? '🧂' : '🍕') + '%3C/text%3E%3C/svg%3E\'" />';
      html += '<div class="info">';
      html += '<div class="title">' + it.title + (isExtra ? ' 🧂' : '') + '</div>';
      html += '<div class="price">' + money(it.price) + '</div>';
      html += '</div>';
      html += '<div class="qty-control">';
      html += '<button class="btn secondary small" onclick="alterarQtd(' + j + ',-1)">−</button>';
      html += '<span class="qty">' + it.qty + '</span>';
      html += '<button class="btn primary small" onclick="alterarQtd(' + j + ',1)">+</button>';
      html += '</div>';
      html += '<div class="item-total">' + money(sub) + '</div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }
  renderTotais();
  var btn = document.getElementById('btnConfirmar');
  if (btn) btn.disabled = c.length === 0;
}

function alterarQtd(i, delta) {
  var c = getCart();
  c[i].qty = (c[i].qty || 1) + delta;
  if (c[i].qty <= 0) c.splice(i, 1);
  setCart(c);
  renderCart();
}

function limparSacola() {
  if (getCart().length === 0) {
    showToast('Sacola já está vazia', 'warning');
    return;
  }
  if (confirm('Tem certeza que deseja esvaziar a sacola?')) {
    localStorage.removeItem(CART_KEY);
    localStorage.removeItem(CUPOM_KEY);
    cupomAplicado = null;
    document.getElementById('cupomAplicado').classList.remove('visible');
    document.getElementById('cupomInput').value = '';
    document.getElementById('cupomInput').disabled = false;
    document.getElementById('btnAplicarCupom').disabled = false;
    renderCart();
    showToast('Sacola esvaziada');
  }
}

// ============================================================
// TOTAIS COM DESCONTO
// ============================================================
function renderTotais() {
  var c = getCart();
  var sub = 0;
  for (var i = 0; i < c.length; i++) {
    sub += (c[i].price || 0) * (c[i].qty || 1);
  }
  
  var desconto = 0;
  if (cupomAplicado) {
    desconto = sub * (cupomAplicado.desconto / 100);
  }
  
  var totalComDesconto = sub - desconto;
  var totalFinal = totalComDesconto + (taxaAtual || 0);
  
  var container = document.getElementById('totais');
  container.innerHTML = 
    '<div class="linha"><span>Subtotal</span><span>' + money(sub) + '</span></div>' +
    (cupomAplicado ? '<div class="linha"><span>Desconto (' + cupomAplicado.desconto + '%)</span><span class="desconto">-' + money(desconto) + '</span></div>' : '') +
    '<div class="linha"><span>Entrega</span><span>' + (taxaAtual !== null ? money(taxaAtual) : '—') + (distanciaAtual ? ' <span class="distancia">(' + distanciaAtual.toFixed(1) + ' km)</span>' : '') + '</span></div>' +
    '<div class="linha total"><span>Total</span><span class="valor">' + money(totalFinal) + '</span></div>';
}

function renderCupom() {
  var c = getCart();
  var containerItens = document.getElementById('cupomItens');
  var containerTotal = document.getElementById('cupomTotal');
  var sub = 0;
  for (var i = 0; i < c.length; i++) {
    sub += (c[i].price || 0) * (c[i].qty || 1);
  }
  
  var desconto = 0;
  if (cupomAplicado) {
    desconto = sub * (cupomAplicado.desconto / 100);
  }
  
  var total = sub - desconto + (taxaAtual || 0);

  if (c.length === 0) {
    containerItens.innerHTML = '<span style="color:#6a7a8a;">Nenhum item</span>';
    containerTotal.innerHTML = '<div style="color:#6a7a8a;">Total: <span style="color:#FFD700;">' + money(0) + '</span></div>';
    return;
  }

  var itensHtml = '';
  for (var j = 0; j < c.length; j++) {
    itensHtml += c[j].qty + 'x ' + c[j].title + (c[j].tipo === 'extra' ? ' 🧂' : '') + '<br>';
  }
  containerItens.innerHTML = itensHtml;
  containerTotal.innerHTML = 
    '<div>Subtotal: ' + money(sub) + '</div>' +
    (cupomAplicado ? '<div style="color:#4caf50;">Desconto: -' + money(desconto) + '</div>' : '') +
    '<div>Entrega: <span style="color:#4caf50;">' + (taxaAtual !== null ? money(taxaAtual) : '—') + '</span></div>' +
    '<div style="margin-top:4px;font-size:16px;color:#FFD700;">Total: ' + money(total) + '</div>';
}

// ============================================================
// DEBOUNCE PARA CALCULAR TAXA
// ============================================================
function debounce(fn, d) {
  var t;
  return function() {
    var args = arguments;
    clearTimeout(t);
    t = setTimeout(function() { fn.apply(null, args); }, d);
  };
}

function calcularTaxaEndereco() {
  var rua = document.getElementById('rua');
  var numero = document.getElementById('numero');
  var cidade = document.getElementById('cidade');
  if (rua.value.length < 3 || !numero.value || !cidade.value) return;
  
  var end = rua.value + ', ' + numero.value + ', ' + cidade.value + ', SP';
  fetch('https://maps.googleapis.com/maps/api/geocode/json?address=' + encodeURIComponent(end) + '&key=' + GOOGLE_KEY)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.results[0] && configEntrega && configEntrega.loja) {
        var loc = d.results[0].geometry.location;
        distanciaAtual = distanciaKm(configEntrega.loja.lat, configEntrega.loja.lon, loc.lat, loc.lng);
        taxaAtual = calcularTaxa(distanciaAtual);
        renderTotais();
        renderCupom();
      }
    })
    .catch(function(e) {
      console.error('Erro ao calcular taxa:', e);
    });
}
var calcDebounced = debounce(calcularTaxaEndereco, 800);

function usarLocalizacao() {
  var btn = document.getElementById('btnGeo');
  var status = document.getElementById('geoStatus');
  if (!navigator.geolocation) {
    status.textContent = '❌ Seu navegador não suporta GPS';
    status.className = 'geo-status error';
    return;
  }
  btn.disabled = true;
  status.textContent = '⏳ Buscando sua localização...';
  status.className = 'geo-status';
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      if (configEntrega && configEntrega.loja) {
        distanciaAtual = distanciaKm(configEntrega.loja.lat, configEntrega.loja.lon, lat, lon);
        taxaAtual = calcularTaxa(distanciaAtual);
      }
      fetch('https://maps.googleapis.com/maps/api/geocode/json?latlng=' + lat + ',' + lon + '&key=' + GOOGLE_KEY + '&language=pt-BR')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.results[0]) {
            var comp = data.results[0].address_components;
            var get = function(t) {
              var found = null;
              for (var i = 0; i < comp.length; i++) {
                if (comp[i].types.indexOf(t) !== -1) {
                  found = comp[i];
                  break;
                }
              }
              return found ? found.long_name : '';
            };
            document.getElementById('rua').value = get('route');
            document.getElementById('numero').value = get('street_number');
            document.getElementById('bairro').value = get('sublocality') || get('sublocality_level_1') || get('neighborhood');
            var cid = get('administrative_area_level_2') || get('locality');
            var select = document.getElementById('cidade');
            var existe = false;
            for (var k = 0; k < select.options.length; k++) {
              if (select.options[k].value === cid) {
                existe = true;
                break;
              }
            }
            if (cid && !existe) {
              var opt = document.createElement('option');
              opt.value = cid;
              opt.textContent = cid;
              select.appendChild(opt);
            }
            if (cid) select.value = cid;
          }
          renderTotais();
          renderCupom();
          status.textContent = '✅ Localização encontrada - ' + distanciaAtual.toFixed(1) + ' km';
          status.className = 'geo-status';
          btn.disabled = false;
        })
        .catch(function(e) {
          status.textContent = '❌ Erro ao buscar endereço';
          status.className = 'geo-status error';
          btn.disabled = false;
        });
    },
    function(err) {
      status.textContent = '⚠️ Permita o acesso à localização';
      status.className = 'geo-status error';
      btn.disabled = false;
    },
    {enableHighAccuracy: true, timeout: 12000}
  );
}

// ============================================================
// ENVIAR PEDIDO
// ============================================================
function enviarPedido() {
  var c = getCart();
  var erroEl = document.getElementById('erroEnvio');
  erroEl.classList.remove('visible');
  erroEl.textContent = '';

  if (!c.length) {
    alert('Sacola vazia');
    return;
  }

  var nome = document.getElementById('nome');
  var telefone = document.getElementById('telefone');
  var cidade = document.getElementById('cidade');
  var rua = document.getElementById('rua');
  var numero = document.getElementById('numero');
  var bairro = document.getElementById('bairro');
  var pagamento = document.getElementById('pagamento');
  var troco = document.getElementById('troco');

  if (!nome.value.trim()) {
    alert('Digite seu nome completo');
    nome.focus();
    return;
  }
  var telDigits = telefone.value.replace(/\D/g, '');
  if (telDigits.length < 10) {
    alert('WhatsApp com DDD (ex: 11999999999)');
    telefone.focus();
    return;
  }
  if (!cidade.value || !rua.value.trim() || !numero.value.trim() || !bairro.value.trim() || !pagamento.value) {
    alert('Preencha todos os campos obrigatórios (*)');
    return;
  }
  if (taxaAtual === null) taxaAtual = 5;

  var btn = document.querySelector('#modalEndereco .btn.primary');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';
  document.getElementById('loadingOverlay').classList.add('active');

  var codigoPedido = gerarCodigoPedido();
  var subtotal = 0;
  for (var i = 0; i < c.length; i++) {
    subtotal += (Number(c[i].price) || 0) * (Number(c[i].qty) || 1);
  }
  
  var desconto = 0;
  if (cupomAplicado) {
    desconto = subtotal * (cupomAplicado.desconto / 100);
  }
  var total = subtotal - desconto + taxaAtual;
  
  var itensFormatados = [];
  for (var j = 0; j < c.length; j++) {
    itensFormatados.push({
      id: c[j].id,
      nome: c[j].title,
      title: c[j].title,
      preco: Number(c[j].price),
      price: Number(c[j].price),
      valor: Number(c[j].price),
      quantidade: Number(c[j].qty),
      qty: Number(c[j].qty),
      total: Number(c[j].price) * Number(c[j].qty),
      img: c[j].img || '',
      tipo: c[j].tipo || 'produto'
    });
  }

  var pedido = {
    id: codigoPedido,
    numeroPedido: codigoPedido,
    origem: 'cardapio',
    cliente: {
      nome: nome.value.trim(),
      telefone: telDigits,
      cidade: cidade.value,
      rua: rua.value.trim(),
      numero: numero.value.trim(),
      bairro: bairro.value.trim(),
      pagamento: pagamento.value,
      troco: troco.value.trim() || null,
      lat: null,
      lng: null
    },
    itens: itensFormatados,
    subtotal: subtotal,
    taxa: taxaAtual,
    taxaEntrega: taxaAtual,
    distanciaKm: distanciaAtual ? Number(distanciaAtual.toFixed(2)) : null,
    total: total,
    pagamento: pagamento.value,
    troco: troco.value ? Number(troco.value.replace(/\D/g, '')) : null,
    cupom: cupomAplicado || null,
    desconto: desconto,
    status: 'novo',
    criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    criadoEmMs: Date.now()
  };

  db.collection('pedidos').doc(codigoPedido).set(pedido)
    .then(function() {
      localStorage.setItem('pasterry_cliente_v1', JSON.stringify(pedido.cliente));
      var hist = JSON.parse(localStorage.getItem('pedidos_pasterry_v1') || '[]');
      hist.push({...pedido, criadoEm: new Date().toISOString()});
      localStorage.setItem('pedidos_pasterry_v1', JSON.stringify(hist));
      localStorage.removeItem(CART_KEY);
      localStorage.removeItem(CUPOM_KEY);
      alert('✅ Pedido #' + codigoPedido + ' confirmado!\n\n' + (cupomAplicado ? 'Cupom ' + cupomAplicado.codigo + ' aplicado: ' + cupomAplicado.desconto + '% de desconto' : ''));
      location.href = 'status.html?id=' + codigoPedido;
    })
    .catch(function(err) {
      console.error('Erro ao enviar pedido:', err);
      erroEl.textContent = '❌ Erro ao enviar pedido: ' + (err.message || 'Erro desconhecido. Tente novamente.');
      erroEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Confirmar e Enviar';
      document.getElementById('loadingOverlay').classList.remove('active');
    });
}

// ============================================================
// MÁSCARA DE TELEFONE
// ============================================================
function mascaraTelefone(input) {
  var v = input.value.replace(/\D/g, '');
  if (v.length > 11) v = v.slice(0, 11);
  if (v.length <= 2) {
    input.value = v ? '(' + v : '';
  } else if (v.length <= 7) {
    input.value = '(' + v.slice(0,2) + ') ' + v.slice(2);
  } else {
    input.value = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
  }
}
